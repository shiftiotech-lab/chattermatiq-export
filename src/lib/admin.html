<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChattermatIQ · Admin</title>
<style>
  :root{--bg:#020617;--panel:#0f172a;--border:#1e293b;--electric:#60a5fa;--electric-300:#93c5fd;--text:#f1f5f9;--muted:#94a3b8;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Space Grotesk",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;padding:24px}
  .wrap{max-width:1200px;margin:0 auto}
  h1{font-size:24px;font-weight:700;margin-bottom:4px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
  .nav{margin-bottom:18px}
  .nav a{color:var(--electric);text-decoration:none;margin-right:16px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
  input,select,button{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 14px;font-size:14px;font-family:inherit}
  input:focus,select:focus{border-color:var(--electric);outline:none}
  button{cursor:pointer}
  button:hover{border-color:var(--electric);color:var(--electric-300)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}
  .card .n{font-size:26px;font-weight:700;color:var(--electric-300)}
  .card .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
  .grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:22px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}
  .panel h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  th{color:var(--muted);font-weight:600}
  td.plat{font-weight:600;color:var(--electric-300)}
  .pl{background:rgba(96,165,250,.12);color:var(--electric-300);border:1px solid rgba(96,165,250,.3);padding:2px 8px;border-radius:99px;font-size:11px}
  .usd{color:#86efac;font-weight:500}
  .err{background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.4);color:#fca5a5;border-radius:10px;padding:12px 14px;margin-bottom:16px}
  .muted{color:var(--muted)}
  .hidden{display:none!important}
  a{color:var(--electric)}
  .row{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}
  /* login card */
  .login{max-width:360px;margin:60px auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:26px}
  .login h2{font-size:18px;font-weight:700;margin-bottom:14px}
  .login input{width:100%}
</style></head>
<body>
<div class="wrap">
  <h1>⚡ ChattermatIQ · Admin</h1>
  <div class="sub">Every link that has come through the site, with comment counts and AI/online costs per request.</div>
  <div class="nav"><a href="/admin">Usage & links</a><a href="/admin/costs">Costs ($)</a><a href="#" id="lg">Log out</a></div>
</div>

<div class="login" id="loginCard" style="display:none">
  <h2>Admin login</h2>
  <input id="user" placeholder="Username" autocomplete="username">
  <br><br>
  <input id="pass" type="password" placeholder="Password" autocomplete="current-password" style="margin-top:10px">
  <br><br>
  <button id="loginBtn" style="width:100%">Sign in</button>
  <div id="loginErr" class="err hidden"></div>
</div>

<div class="wrap" id="mainWrap" style="display:none">
  <div class="bar">
    <input id="tok" type="password" placeholder="Admin token" style="min-width:180px">
    <select id="days"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select>
    <select id="platform"><option value="">All platforms</option><option value="youtube">YouTube</option><option value="instagram">Instagram</option><option value="facebook">Facebook</option><option value="x">X</option><option value="reddit">Reddit</option><option value="linkedin">LinkedIn</option><option value="error">Errors</option></select>
    <button id="load">Load</button>
  </div>
  <div id="err" class="err hidden"></div>

  <div class="cards" id="cards"></div>
  <div class="grid">
    <div class="panel"><h3>By platform (requests)</h3><table id="platT"></table></div>
    <div class="panel"><h3>By user (client id)</h3><table id="usrT"></table></div>
  </div>
  <div class="panel"><h3>Recent activity</h3><table id="actT"></table></div>
</div>

<script>
const $=id=>document.getElementById(id);
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
const TOKEN_KEY='cmq_admin_tok';

async function doLogin(){
  const u=$('user').value.trim(), p=$('pass').value;
  if(!u||!p){ showLogin('Enter username and password.'); return; }
  $('loginErr').classList.add('hidden');
  try{
    const res=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({u,p})});
    const d=await res.json().catch(()=>({}));
    if(!res.ok){ showLogin((d&&d.error)||'Login failed'); return; }
    localStorage.setItem(TOKEN_KEY, d.token);
    entered();
  }catch(e){ showLogin('Network error'); }
}
function showLogin(m){ $('loginErr').textContent=m; $('loginErr').classList.remove('hidden'); }

function entered(){
  const tokVal=localStorage.getItem(TOKEN_KEY)||'';
  if(tokVal){ $('tok').value=tokVal; $('loginCard').style.display='none'; $('mainWrap').style.display=''; load(); }
  else { $('loginCard').style.display=''; $('mainWrap').style.display='none'; }
}
function load(){
  const t=localStorage.getItem(TOKEN_KEY)||$('tok').value.trim();
  if(!t){ entered(); return; }
  $('err').classList.add('hidden');
  const q=new URLSearchParams({days:$('days').value,platform:$('platform').value,limit:1500}).toString();
  fetch('/api/admin/usage?'+q,{headers:{'x-admin-token':t}}).then(r=>{
    if(r.status===401){ localStorage.removeItem(TOKEN_KEY); entered(); throw new Error('Session expired'); }
    if(!r.ok){ return r.json().then(d=>{ throw new Error((d&&d.error)||('HTTP '+r.status)); }); }
    return r.json();
  }).then(render).catch(e=>show(e.message));
}
function show(m){ $('err').textContent=m; $('err').classList.remove('hidden'); }
function fmtUsd(v){ const n=Number(v)||0; return n>0 ? ('$'+n.toFixed(3)) : '—'; }

function render(data){
  const s=data.summary||{};
  const rows=data.rows||[];
  const linkedins=rows.filter(r=>r.platform==='linkedin').length;
  $('cards').innerHTML=[
    ['Requests (window)', s.total||0],
    ['Active days', (s.byDay?Object.keys(s.byDay).length:0)],
    ['LinkedIn requests', linkedins],
    ['Unique users', s.byUser?Object.keys(s.byUser).length:0]
  ].map(([l,n])=>`<div class="card"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

  const bp=Object.entries(s.byPlatform||{}).sort((a,b)=>b[1]-a[1]);
  $('platT').innerHTML='<tr><th>Platform</th><th>Requests</th></tr>'+(bp.map(([k,v])=>`<tr><td class="plat">${esc(k)}</td><td>${v}</td></tr>`).join('')||'<tr><td class="muted">none</td></tr>');

  const bu=Object.entries(s.byUser||{}).sort((a,b)=>b[1]-a[1]).slice(0,12);
  $('usrT').innerHTML='<tr><th>User</th><th>Requests</th></tr>'+(bu.map(([k,v])=>`<tr><td class="row">${esc(k)}</td><td>${v}</td></tr>`).join('')||'<tr><td class="muted">none</td></tr>');

  $('actT').innerHTML='<tr><th>Time</th><th>User</th><th>Platform</th><th>Action</th><th>Comments</th><th>AI</th><th>Apify $</th><th>AI $</th><th>Status</th><th>Link</th></tr>'+
    rows.map(r=>`<tr>
      <td>${esc((r.ts||'').replace('T',' ').slice(0,19))}</td>
      <td class="row">${esc(r.uid||r.ip||'anon')}</td>
      <td>${r.platform?`<span class="pl">${esc(r.platform)}</span>`:'—'}</td>
      <td>${esc(r.action||'')}</td>
      <td>${r.comments!=null?r.comments:'—'}</td>
      <td>${r.action==='analysis'?(r.ai==='ok'?'🧠':'off'):'—'}</td>
      <td class="usd">${fmtUsd(r.apifyCostUsd)}</td>
      <td class="usd">${fmtUsd(r.aiCostUsd)}</td>
      <td>${esc(r.status||'')}</td>
      <td>${r.url?`<a class="row" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url).slice(0,70)}</a>`:'—'}</td>
    </tr>`).join('')||'<tr><td class="muted">No activity in this window.</td></tr>';
}

$('loginBtn').addEventListener('click', doLogin);
$('pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
$('load').addEventListener('click', ()=>{ localStorage.setItem(TOKEN_KEY,$('tok').value.trim()); load(); });
$('lg').addEventListener('click', ()=>{ localStorage.removeItem(TOKEN_KEY); entered(); });

(function(){
  if(localStorage.getItem(TOKEN_KEY)){ entered(); } else { $('loginCard').style.display=''; }
})();
</script></body></html>
